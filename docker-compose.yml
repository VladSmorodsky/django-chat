services:
  db:
    image: postgres:17.4
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - chat_data:/var/lib/postgresql/data

  web:
    build: .
    command: bash -c "python manage.py migrate && uvicorn --host 0.0.0.0 --port 9000 django_chat.asgi:application --reload"
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - db
      - redis
    ports:
      - '9000:9000'
    healthcheck:
      test: ping 0.0.0.0 -p 9000 -c 1
      interval: 60s
      timeout: 10s
      retries: 1

  redis:
    image: redis:7.4.2
    ports:
      - '6379:6379'

volumes:
  chat_data: { }
  media_data: { }
